<h2>Liste des tâches</h2>

@if (tasks$ | async; as tasks) {
  <ul>
    @for (t of tasks; track t.id) {
      <li>
        {{ t.title }}
        <button type="button" (click)="highlight(t)">
          Mettre en avant
        </button>
        <!-- 🆕 Bouton Supprimer -->
        <button type="button" (click)="deleteTask(t.id)" class="btn-delete">
          Supprimer
        </button>
      </li>
    }
  </ul>
} @else {
  <p>Chargement des tâches...</p>
}

<hr />

<h3>Actions</h3>
<button (click)="addTask('Nouvelle tâche')">Ajouter une tâche</button>


<div #highlightContainer></div>
