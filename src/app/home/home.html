<h2>Liste des tâches (BehaviorSubject)</h2>

<p>Temps écoulé : {{ count / 2 }} secondes</p>

<button (click)="addTask()">Ajouter une tâche</button>
<button (click)="refreshTasks()">Simuler un refresh</button>

<hr>

@if (tasks$ | async; as tasks) {
  <ul>
    @for (t of tasks; track t.id) {
      <li>{{ t.title }}</li>
    }
  </ul>
} @else {
  <p>Chargement des tâches ...</p>
}
